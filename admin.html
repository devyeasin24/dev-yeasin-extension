<!DOCTYPE html>
<html>
<head>
    <title>🚀 Dev Yeasin - Admin Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; }
        body { background: #0a0a1a; color: #fff; font-family: 'Segoe UI', sans-serif; padding: 20px; max-width: 900px; margin: auto; }
        .card { background: linear-gradient(145deg, #1a1a2e, #16162e); padding: 25px; border-radius: 20px; margin-bottom: 20px; border: 1px solid #4a4a8a; box-shadow: 0 0 30px rgba(0,150,255,0.1); }
        h1 { background: linear-gradient(90deg, #00d4ff, #7b2ffc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 28px; }
        .flex { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        input, button { padding: 12px 18px; border-radius: 12px; border: none; font-size: 14px; }
        input { background: #0a0a1a; border: 2px solid #4a4a8a; color: #fff; flex: 2; min-width: 200px; }
        button { background: linear-gradient(90deg, #00d4ff, #7b2ffc); color: white; font-weight: bold; cursor: pointer; transition: all 0.3s; }
        button:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(0,212,255,0.3); }
        .user-item { background: #0a0a1a; padding: 15px; border-radius: 12px; margin: 10px 0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; border-left: 4px solid #4a4a8a; }
        .badge { padding: 4px 14px; border-radius: 20px; font-size: 11px; font-weight: bold; }
        .active { background: #00c853; color: #fff; }
        .inactive { background: #d50000; color: #fff; }
        .small-btn { background: #2a2a4a; color: #fff; padding: 5px 15px; font-size: 12px; border-radius: 8px; }
        .danger-btn { background: #d50000; }
        .code-display { background: #0a0a1a; padding: 15px; border-radius: 10px; color: #00d4ff; font-size: 22px; font-family: monospace; word-break: break-all; margin-top: 10px; display: none; border: 1px dashed #4a4a8a; }
        .stats { display: flex; gap: 20px; margin-bottom: 15px; flex-wrap: wrap; }
        .stat-box { background: #0a0a1a; padding: 10px 20px; border-radius: 12px; text-align: center; flex: 1; min-width: 100px; }
        .stat-box .number { font-size: 24px; font-weight: bold; background: linear-gradient(90deg, #00d4ff, #7b2ffc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .stat-box .label { font-size: 11px; color: #888; }
        .copy-btn { background: #2a2a4a; padding: 5px 12px; font-size: 11px; }
        .error-msg { color: #ff6b6b; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>🚀 Dev Yeasin Admin Panel</h1>

    <div class="stats" id="stats">
        <div class="stat-box"><div class="number" id="totalUsers">0</div><div class="label">Total Users</div></div>
        <div class="stat-box"><div class="number" id="activeUsers">0</div><div class="label">Active</div></div>
        <div class="stat-box"><div class="number" id="inactiveUsers">0</div><div class="label">Inactive</div></div>
    </div>

    <div class="card">
        <h2>➕ Generate Activation Code</h2>
        <div class="flex">
            <input type="text" id="emailInput" placeholder="Team Member Email (e.g., team@client.com)">
            <button onclick="generateCode()">✨ Generate Code</button>
        </div>
        <div id="newCodeDisplay" class="code-display"></div>
        <div id="errorMsg" class="error-msg"></div>
    </div>

    <div class="card">
        <h2>👥 Team Members</h2>
        <button onclick="fetchUsers()" style="margin-bottom:15px;">🔄 Refresh List</button>
        <div id="userList"></div>
    </div>

    <script>
        // ================================================================
        // 🔑 REPLACE THESE WITH YOUR SUPABASE DETAILS
        // ================================================================
        const supabaseUrl = "https://gpnrxkfmpkwzxbpnrgvf.supabase.co";  // e.g., https://abc123xyz.supabase.co
        const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdwbnJ4a2ZtcGt3enhicG5yZ3ZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0NDg3MTMsImV4cCI6MjEwNDAyNDcxM30.C5_IfFUDnsxfM7nu57YeFF72m99z2R9JEpDKe34SWtQ";                        // e.g., eyJhbGciOiJIUzI1NiIs...
        // ================================================================

        // Create Supabase client (ONLY ONCE)
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        // ==================== FUNCTIONS ====================

        async function generateCode() {
            const email = document.getElementById('emailInput').value.trim();
            const errorEl = document.getElementById('errorMsg');
            errorEl.textContent = '';

            if (!email) {
                errorEl.textContent = '⚠️ Please enter an email address!';
                return;
            }

            const code = 'DY-' + Math.random().toString(36).substring(2, 10).toUpperCase();

            const { error } = await supabase.from('users').insert({
                activation_code: code,
                email: email,
                is_active: true
            });

            if (error) {
                errorEl.textContent = '❌ Error: ' + error.message;
                return;
            }

            const display = document.getElementById('newCodeDisplay');
            display.style.display = 'block';
            display.innerHTML = `
                🎯 Code for <strong>${email}</strong>:<br>
                <span style="font-size:28px;">${code}</span><br>
                <button class="copy-btn" onclick="copyText('${code}')">📋 Copy Code</button>
            `;
            document.getElementById('emailInput').value = '';
            fetchUsers();
        }

        function copyText(text) {
            navigator.clipboard.writeText(text);
            alert('✅ Code copied to clipboard!');
        }

        async function fetchUsers() {
            const { data, error } = await supabase.from('users').select('*').order('id', { ascending: false });

            if (error) {
                document.getElementById('userList').innerHTML = '❌ Error loading users: ' + error.message;
                return;
            }

            let html = '';
            let total = 0,
                active = 0,
                inactive = 0;

            data.forEach(u => {
                total++;
                if (u.is_active) active++;
                else inactive++;

                html += `
                    <div class="user-item">
                        <div>
                            <strong>${u.email}</strong><br>
                            <span style="font-size:12px; color: #888;">Code: ${u.activation_code}</span>
                        </div>
                        <div class="flex" style="gap:8px;">
                            <span class="badge ${u.is_active ? 'active' : 'inactive'}">${u.is_active ? '✅ ACTIVE' : '⛔ INACTIVE'}</span>
                            <button class="small-btn" onclick="toggleUser(${u.id}, ${u.is_active})">${u.is_active ? '🔴 Deactivate' : '🟢 Activate'}</button>
                            <button class="small-btn danger-btn" onclick="deleteUser(${u.id})">🗑️ Remove</button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('userList').innerHTML = html;
            document.getElementById('totalUsers').textContent = total;
            document.getElementById('activeUsers').textContent = active;
            document.getElementById('inactiveUsers').textContent = inactive;
        }

        async function toggleUser(id, current) {
            const { error } = await supabase.from('users').update({ is_active: !current }).eq('id', id);
            if (error) return alert('Error: ' + error.message);
            fetchUsers();
        }

        async function deleteUser(id) {
            if (!confirm('⚠️ Permanently remove this user? They will lose access immediately!')) return;
            const { error } = await supabase.from('users').delete().eq('id', id);
            if (error) return alert('Error: ' + error.message);
            fetchUsers();
        }

        // Load users immediately
        fetchUsers();
    </script>
</body>
</html>
